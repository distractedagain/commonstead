services:
  commonstead:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - commonstead-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    restart: "no"
volumes:
  commonstead-data:
