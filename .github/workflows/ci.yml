name: CRM verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_clean_install.py
      - run: python scripts/check_release.py
      - run: node --check commonstead/static/app.js
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local container
        run: docker compose build
      - name: Verify isolated startup
        run: |
          docker compose up --wait --wait-timeout 60
          curl --fail http://127.0.0.1:8765/health
      - name: Remove test container and volume
        if: always()
        run: docker compose down --volumes
